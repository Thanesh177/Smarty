<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="google-site-verification" content="ezwg4QB42n2FerroHL1xTrKwOqvI_LxOudW32OnzvxY" />
    <meta charset="UTF-8" />

    <!-- Mobile / WebView -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050816" />
    <meta name="color-scheme" content="dark" />

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Smarty" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Smarty</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #050816;
        color: #ffffff;
        overflow-x: hidden;
      }

      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(
            circle at top,
            rgba(34, 211, 238, 0.11),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom,
            rgba(99, 102, 241, 0.1),
            transparent 24%
          ),
          linear-gradient(180deg, #030712 0%, #020617 100%);
      }

      .boot-loader {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .boot-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black 34%, transparent 85%);
        opacity: 0.34;
        pointer-events: none;
      }

      .boot-loader-card {
        position: relative;
        z-index: 2;
        width: min(88vw, 260px);
        padding: 28px 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0.03)
        );
        backdrop-filter: blur(20px);
        box-shadow:
          0 20px 70px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .boot-loader-orb {
        position: relative;
        width: 58px;
        height: 58px;
        border-radius: 999px;
        background:
          radial-gradient(
            circle at center,
            rgba(103, 232, 249, 0.92) 0 7%,
            transparent 8%
          ),
          conic-gradient(
            from 0deg,
            transparent 0 55%,
            rgba(34, 211, 238, 0.98) 72%,
            transparent 88% 100%
          );
        box-shadow: 0 0 42px rgba(34, 211, 238, 0.3);
        animation: bootSpin 1.05s linear infinite;
      }

      .boot-loader-orb::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: inherit;
        background: #020617;
        box-shadow:
          inset 0 0 20px rgba(34, 211, 238, 0.08),
          0 0 0 1px rgba(103, 232, 249, 0.12);
      }

      .boot-loader-orb::before {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: inherit;
        border: 1px solid rgba(103, 232, 249, 0.16);
        animation: bootSignal 1.8s ease-in-out infinite;
      }

      .boot-loader-card strong {
        font-size: 1.04rem;
        letter-spacing: -0.05em;
        font-weight: 800;
        color: #f8fafc;
      }

      .boot-loader-card span {
        font-size: 0.8rem;
        line-height: 1.5;
        color: rgba(226, 232, 240, 0.66);
      }

      @keyframes bootSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bootSignal {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.32;
        }

        50% {
          transform: scale(1.08);
          opacity: 0.9;
        }
      }

      /* Match the React opening screen so startup remains one continuous scene. */
      .boot-loader {
        background: #020810;
      }

      .boot-loader::before {
        background-image:
          linear-gradient(rgba(184, 226, 234, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(184, 226, 234, 0.014) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: radial-gradient(circle at center, black, transparent 68%);
        -webkit-mask-image: radial-gradient(circle at center, black, transparent 68%);
        opacity: 1;
      }

      .boot-loader::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(720px, 92vw);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(133, 211, 226, 0.05);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(72, 178, 202, 0.11), rgba(15, 80, 105, 0.03) 40%, transparent 70%);
        filter: blur(12px);
        pointer-events: none;
      }

      .boot-loader-card {
        width: auto;
        padding: 0;
        gap: 5px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .boot-loader-orb {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        margin-bottom: 13px;
        border-radius: 20px;
        background: linear-gradient(145deg, #f3fbfc, #b9e3eb);
        color: #07121d;
        box-shadow: 0 24px 70px rgba(28, 132, 157, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.82);
        animation: bootOpeningMark 760ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .boot-loader-orb::after {
        content: "S";
        position: static;
        display: block;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font-size: 1.55rem;
        font-weight: 880;
        letter-spacing: -0.07em;
        box-shadow: none;
      }

      .boot-loader-orb::before {
        display: block;
        inset: -13px;
        border: 0;
        border-radius: 26px;
        background: conic-gradient(from 40deg, transparent 0 26%, rgba(134, 222, 239, 0.62) 38%, transparent 49% 78%, rgba(134, 222, 239, 0.24) 90%, transparent);
        mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 0);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 1px), #000 0);
        animation: bootOrbit 5.5s linear infinite;
      }

      .boot-loader-card strong {
        color: rgba(242, 249, 251, 0.96);
        font-size: 1.35rem;
        font-weight: 760;
        line-height: 1;
        letter-spacing: -0.055em;
      }

      .boot-loader-card span {
        color: rgba(179, 202, 209, 0.48);
        font-size: 0.61rem;
        font-weight: 720;
        line-height: 1.4;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .boot-loader-status {
        display: inline-flex !important;
        align-items: center;
        gap: 7px;
        margin-top: 5px;
        color: rgba(166, 195, 203, 0.38) !important;
        font-size: 0.55rem !important;
        font-weight: 680 !important;
        letter-spacing: 0.08em !important;
        text-transform: none !important;
      }

      .boot-loader-status::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #78d7e8;
        box-shadow: 0 0 0 4px rgba(93, 202, 222, 0.08), 0 0 14px rgba(93, 202, 222, 0.42);
        animation: bootSignalDot 1.4s ease-in-out infinite;
      }

      @keyframes bootOpeningMark {
        from { opacity: 0; transform: translateY(8px) scale(0.88); filter: blur(8px); }
        to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
      }

      @keyframes bootOrbit { to { transform: rotate(360deg); } }
      @keyframes bootSignalDot { 50% { opacity: 0.45; transform: scale(0.82); } }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader-orb,
        .boot-loader-orb::before,
        .boot-loader-status::before { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader-card">
          <div class="boot-loader-orb"></div>
          <strong>Smarty</strong>
          <span>Learn · Share · Grow</span>
          <span class="boot-loader-status">Connecting your space</span>
        </div>
      </div>
    </div>

    <noscript>
      <div
        style="
          padding: 24px;
          color: white;
          background: #050816;
          font-family: system-ui;
        "
      >
        Smarty requires JavaScript to run.
      </div>
    </noscript>

<script>
  (function () {
    var userAgent = navigator.userAgent || "";
    var urlParams = new URLSearchParams(window.location.search);

    var isSmartyNativeApp =
      window.__SMARTY_NATIVE_APP__ === true ||
      window.__SMARTY_PLATFORM__ === "ios" ||
      window.__SMARTY_IS_NATIVE_APP__ === true ||
      urlParams.get("nativeApp") === "ios" ||
      /Smarty-iOS/i.test(userAgent);

    var isThirdPartyInAppBrowser =
      /LinkedInApp|Telegram|FBAN|FBAV|Instagram|TikTok/i.test(userAgent);

    var isBlockedInAppBrowser =
      !isSmartyNativeApp && isThirdPartyInAppBrowser;

    window.__SMARTY_IS_NATIVE_APP__ = isSmartyNativeApp;
    window.__SMARTY_IS_BLOCKED_BROWSER__ = isBlockedInAppBrowser;
    window.__SMARTY_APP_MOUNTED__ = false;
    window.__SMARTY_BOOT_STARTED__ = Date.now();
    window.__SMARTY_BOOT_ERROR__ = "";

    console.log("[Smarty] environment", {
      nativeApp: isSmartyNativeApp,
      blockedBrowser: isBlockedInAppBrowser,
      userAgent: userAgent,
      url: window.location.href,
    });

    function getRoot() {
      return document.getElementById("root");
    }

function hasReactMounted() {
  return window.__SMARTY_APP_MOUNTED__ === true;
}

function markSmartyMounted() {
  window.__SMARTY_APP_MOUNTED__ = true;

  console.log("[Smarty] React mounted");
}

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function recordError(value) {
      var message = String(value || "Unknown JavaScript error");

      window.__SMARTY_BOOT_ERROR__ = message;

      console.error("[Smarty] startup error:", message);
    }

    window.addEventListener("DOMContentLoaded", function () {
      console.log("[Smarty] DOMContentLoaded");
    });

    window.addEventListener("load", function () {
      console.log("[Smarty] window loaded");
    });

    window.addEventListener("smarty:mounted", function () {
      markSmartyMounted();
    });

    window.addEventListener("error", function (event) {
      var message =
        event && event.message
          ? event.message
          : event && event.error
            ? String(event.error)
            : "Unknown window error";

      recordError(message);
    });

    window.addEventListener("unhandledrejection", function (event) {
      var reason =
        event && event.reason
          ? event.reason.stack || event.reason.message || String(event.reason)
          : "Unhandled promise rejection";

      recordError(reason);
    });

    if ("serviceWorker" in navigator && isBlockedInAppBrowser) {
      navigator.serviceWorker
        .getRegistrations()
        .then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister().catch(function () {});
          });
        })
        .catch(function () {});
    }


    window.__SMARTY_SHOW_BOOT_ERROR__ = function () {
      var root = getRoot();

if (window.__SMARTY_APP_MOUNTED__ || !root) {
  return;
}

      var currentUrl = window.location.href;
      var encodedUrl = escapeHtml(currentUrl);
      var errorMessage = escapeHtml(
        window.__SMARTY_BOOT_ERROR__ ||
          "The React application did not mount before the startup timeout."
      );

      var description = isSmartyNativeApp
        ? "Smarty loaded inside the iOS app, but React did not finish starting."
        : isBlockedInAppBrowser
          ? "This browser may be blocking part of the Smarty application."
          : "Smarty could not finish loading its application bundle.";

      root.innerHTML =
        '<div style="min-height:100vh;display:grid;place-items:center;background:#020617;color:white;font-family:Inter,system-ui;padding:24px;text-align:center;">' +
        '<div style="max-width:390px;width:100%;padding:26px 20px;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:0 20px 70px rgba(0,0,0,.45)">' +
        '<div style="width:54px;height:54px;border-radius:999px;margin:0 auto 18px;background:conic-gradient(from 0deg,transparent 0 55%,#22d3ee 72%,transparent 88% 100%);box-shadow:0 0 38px rgba(34,211,238,.32)"></div>' +
        '<h2 style="margin:0 0 10px;font-size:1.1rem;">Smarty could not fully open</h2>' +
        '<p style="margin:0 0 14px;color:rgba(226,232,240,.72);line-height:1.6;font-size:.9rem;">' +
        escapeHtml(description) +
        "</p>" +
        '<pre style="margin:0 0 16px;padding:12px;text-align:left;white-space:pre-wrap;word-break:break-word;border-radius:14px;background:rgba(239,68,68,.08);border:1px solid rgba(248,113,113,.18);color:#fecaca;font-size:.72rem;line-height:1.45;">' +
        errorMessage +
        "</pre>" +
        '<button id="smarty-reload-btn" style="width:100%;border:0;background:#22d3ee;color:#020617;padding:12px 18px;border-radius:999px;font-weight:850;cursor:pointer;">Reload Smarty</button>' +
        '<p style="margin:12px 0 0;color:rgba(148,163,184,.7);font-size:.7rem;word-break:break-all;">' +
        encodedUrl +
        "</p>" +
        "</div>" +
        "</div>";

      var reloadButton = document.getElementById("smarty-reload-btn");

      if (reloadButton) {
        reloadButton.onclick = function () {
          window.location.reload();
        };
      }
    };

setTimeout(function () {
  console.log("[Smarty] boot check", {
    native: isSmartyNativeApp,
    mounted: window.__SMARTY_APP_MOUNTED__,
    error: window.__SMARTY_BOOT_ERROR__,
  });

  if (!window.__SMARTY_APP_MOUNTED__) {
    window.__SMARTY_SHOW_BOOT_ERROR__();
  }
}, isSmartyNativeApp ? 15000 : 6500);
  })();
</script>

<script
  id="smarty-main-module"
  type="module"
  crossorigin
  src="/src/main.jsx"
  onload="console.log('[Smarty] main module downloaded')"
  onerror="window.__SMARTY_BOOT_ERROR__ = 'The main JavaScript module could not be downloaded.'; console.error('[Smarty] main module failed'); window.__SMARTY_SHOW_BOOT_ERROR__();"
></script>
  </body>
</html>
