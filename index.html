<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile / WebView -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="color-scheme" content="dark" />

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smarty" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Smarty</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #050816;
        color: #ffffff;
        overflow-x: hidden;
      }

      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background:
          radial-gradient(circle at top, rgba(34, 211, 238, 0.11), transparent 28%),
          radial-gradient(circle at bottom, rgba(99, 102, 241, 0.10), transparent 24%),
          linear-gradient(180deg, #030712 0%, #020617 100%);
      }

      .boot-loader {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .boot-loader::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(circle at center, black 34%, transparent 85%);
        opacity: 0.34;
        pointer-events: none;
      }

      .boot-loader-card {
        position: relative;
        z-index: 2;
        width: min(88vw, 260px);
        padding: 28px 22px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.08);
        background:
          linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
        backdrop-filter: blur(20px);
        box-shadow:
          0 20px 70px rgba(0,0,0,0.55),
          inset 0 1px 0 rgba(255,255,255,0.08);
      }

      .boot-loader-orb {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 999px;
        background:
          radial-gradient(circle at 35% 35%, #67e8f9 0%, #22d3ee 18%, #0f172a 72%);
        box-shadow:
          0 0 44px rgba(34, 211, 238, 0.42),
          inset 0 0 22px rgba(255,255,255,0.12);
        animation: bootPulse 1.35s ease-in-out infinite;
      }

      .boot-loader-orb::after {
        content: '';
        position: absolute;
        inset: -7px;
        border-radius: inherit;
        border: 1px solid rgba(103, 232, 249, 0.24);
        opacity: 0.9;
        animation: bootRing 2s linear infinite;
      }

      .boot-loader-card strong {
        font-size: 1.04rem;
        letter-spacing: -0.05em;
        font-weight: 800;
        color: #f8fafc;
      }

      .boot-loader-card span {
        font-size: 0.8rem;
        line-height: 1.5;
        color: rgba(226, 232, 240, 0.66);
      }

      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.78;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes bootRing {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-loader">
        <div class="boot-loader-card">
          <div class="boot-loader-orb"></div>
          <strong>Smarty</strong>
          <span>Loading your feed...</span>
        </div>
      </div>
    </div>

    <noscript>
      <div
        style="
          padding: 24px;
          color: white;
          background: #050816;
          font-family: system-ui;
        "
      >
        Smarty requires JavaScript to run.
      </div>
    </noscript>

    <script>
      (function () {
        var isInAppBrowser = /LinkedInApp|Telegram|FBAN|FBAV|Instagram/i.test(
          navigator.userAgent || ''
        );

        if ('serviceWorker' in navigator && isInAppBrowser) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (registrations) {
              registrations.forEach(function (registration) {
                registration.unregister().catch(function () {});
              });
            })
            .catch(function () {});
        }

        window.addEventListener('error', function (event) {
          var message = event && event.message ? event.message : '';

          if (
            message.includes('Failed to fetch dynamically imported module') ||
            message.includes('Importing a module script failed')
          ) {
            window.location.reload();
          }
        });

        setTimeout(function () {
          var root = document.getElementById('root');

          if (
            root &&
            root.innerText &&
            root.innerText.includes('Loading your feed')
          ) {
            root.innerHTML =
              '<div style="min-height:100vh;display:grid;place-items:center;background:#020617;color:white;font-family:Inter,system-ui;padding:24px;text-align:center;">' +
              '<div style="max-width:320px">' +
              '<div style="width:54px;height:54px;border-radius:999px;margin:0 auto 18px;background:radial-gradient(circle,#67e8f9,#0f172a 72%);box-shadow:0 0 40px rgba(34,211,238,.35)"></div>' +
              '<h2 style="margin:0 0 10px;font-size:1.1rem;letter-spacing:-0.04em">Smarty could not fully open</h2>' +
              '<p style="margin:0 0 18px;color:rgba(226,232,240,.7);line-height:1.6">This browser may be blocking modern app features. Try reloading or opening in Chrome/Safari.</p>' +
              '<button onclick="window.location.reload()" style="border:0;background:#22d3ee;color:#020617;padding:12px 18px;border-radius:999px;font-weight:800;cursor:pointer">Reload Smarty</button>' +
              '</div>' +
              '</div>';
          }
        }, 7000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
