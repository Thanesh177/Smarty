<!DOCTYPE html>
<html lang="en" style="background:#06070a;color-scheme:dark">
  <head>
    <meta name="google-site-verification" content="ezwg4QB42n2FerroHL1xTrKwOqvI_LxOudW32OnzvxY" />
    <meta charset="UTF-8" />

    <!-- Mobile / WebView -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06070a" />
    <meta name="color-scheme" content="dark" />
    <script id="smarty-appearance">
/* Runs before the first paint. Keep the key in sync with lib/appTheme.js. */
(function () {
  var theme = 'dark';
  try { if (localStorage.getItem('smarty:appearance:v1') === 'day') theme = 'day'; } catch (_) { /* Storage is optional. */ }
  var root = document.documentElement;
  root.setAttribute('data-app-theme', theme);
  root.style.colorScheme = theme === 'day' ? 'light' : 'dark';
  root.style.backgroundColor = theme === 'day' ? '#f4efe6' : '#06070a';
  var color = document.querySelector('meta[name="theme-color"]');
  if (color) color.setAttribute('content', theme === 'day' ? '#f4efe6' : '#06070a');
  var scheme = document.querySelector('meta[name="color-scheme"]');
  if (scheme) scheme.setAttribute('content', theme === 'day' ? 'light' : 'dark');
})();
    </script>

    <!-- Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Smarty" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <title>Smarty</title>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: #06070a; color: #f7f9ff; overflow-x: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #root { min-height: 100vh; min-height: 100dvh; background: #06070a; }
      .boot-loader { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #06070a; }
      .boot-loader-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px; text-align: center; }
      .boot-loader-orb { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 16px; border-radius: 14px; color: #081b28; background: linear-gradient(150deg, #def5ff, #79c9f3 54%, #4baddf); }
      .boot-loader-orb::after { content: "S"; font-size: 27px; font-weight: 650; letter-spacing: -.06em; }
      .boot-loader-card strong { font-size: 25px; font-weight: 550; line-height: 1.2; letter-spacing: -.055em; }
      .boot-loader-card > span { font-size: 13px; line-height: 1.6; color: #a1a5ad; }
      .boot-loader-card .boot-loader-status { margin-top: 24px; color: #a1a5ad; font-size: 12px; }
      .boot-error-card { box-sizing: border-box; width: min(100%, 420px); margin: 0 auto; gap: 12px; }
      .boot-error-card h1 { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -.035em; }
      .boot-error-card p { margin: 0; color: #b7c1ce; font-size: 15px; line-height: 1.6; }
      .boot-error-card button { min-height: 44px; margin-top: 6px; padding: 8px 16px; border: 0; border-radius: 10px; color: #081b28; background: #a8ddfa; font: inherit; font-weight: 600; cursor: pointer; }
      .boot-error-card button:focus-visible { outline: 2px solid currentColor; outline-offset: -4px; }
      .boot-loader-line { position: relative; width: 96px; height: 2px; margin-top: 9px; overflow: hidden; border-radius: 2px; background: #252a31; }
      .boot-loader-line::after { content: ""; position: absolute; inset: 0; background: #79c9f3; animation: bootReadingLine 1.8s ease-in-out infinite; transform-origin: left; }
      @keyframes bootReadingLine { 0% { transform: translateX(-100%) scaleX(.45); } 100% { transform: translateX(100%) scaleX(.45); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader-line::after { animation: none; opacity: .6; } }
      html[data-app-theme='day'], html[data-app-theme='day'] body,
      html[data-app-theme='day'] #root, html[data-app-theme='day'] .boot-loader { background: #f4efe6 !important; color: #000000; }
      html[data-app-theme='day'] .boot-loader-orb { background: #214d40; color: #fff; }
      html[data-app-theme='day'] .boot-loader-card > span { color: #57645b; }
      html[data-app-theme='day'] .boot-loader-line { background: #e8e0f0; }
      html[data-app-theme='day'] .boot-loader-line::after { background: #214d40; }
      html[data-app-theme='day'] .boot-error-card p { color: #3c4e44; }
      html[data-app-theme='day'] .boot-error-card button { color: #fff; background: #214d40; }
    </style>
  </head>

  <body style="background:#06070a">
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-loader-card">
          <div class="boot-loader-orb" aria-hidden="true"></div>
          <strong>Smarty</strong>
          <span>A little curiosity, every day.</span>
          <span class="boot-loader-status">Opening your space</span>
          <div class="boot-loader-line" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <template id="smarty-boot-error-template">
      <main class="boot-loader">
        <div class="boot-loader-card boot-error-card">
          <div class="boot-loader-orb" aria-hidden="true"></div>
          <h1>Smarty couldn’t open</h1>
          <p role="status">Please reload Smarty to try again.</p>
          <button type="button">Reload Smarty</button>
        </div>
      </main>
    </template>

    <noscript>
      <div
        style="
          padding: 24px;
          color: white;
          background: #050816;
          font-family: system-ui;
        "
      >
        Smarty requires JavaScript to run.
      </div>
    </noscript>

<script id="smarty-startup-recovery">
  (function () {
    var userAgent = navigator.userAgent || "";
    var urlParams = new URLSearchParams(window.location.search);

    var isSmartyNativeApp =
      window.__SMARTY_NATIVE_APP__ === true ||
      window.__SMARTY_PLATFORM__ === "ios" ||
      window.__SMARTY_IS_NATIVE_APP__ === true ||
      urlParams.get("nativeApp") === "ios" ||
      /Smarty-iOS/i.test(userAgent);

    var isThirdPartyInAppBrowser =
      /LinkedInApp|Telegram|FBAN|FBAV|Instagram|TikTok/i.test(userAgent);

    var isBlockedInAppBrowser =
      !isSmartyNativeApp && isThirdPartyInAppBrowser;

    window.__SMARTY_IS_NATIVE_APP__ = isSmartyNativeApp;
    window.__SMARTY_IS_BLOCKED_BROWSER__ = isBlockedInAppBrowser;
    window.__SMARTY_APP_MOUNTED__ = false;

    if ("serviceWorker" in navigator && isBlockedInAppBrowser) {
      navigator.serviceWorker
        .getRegistrations()
        .then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister().catch(function () {});
          });
        })
        .catch(function () {});
    }


    var recoveryShown = false;
    window.__SMARTY_SHOW_BOOT_ERROR__ = function (reason) {
      var root = document.getElementById("root");
      var template = document.getElementById("smarty-boot-error-template");
      if (window.__SMARTY_APP_MOUNTED__ || recoveryShown || !root || !template) return;

      var content = template.content.cloneNode(true);
      var description = content.querySelector("p");
      var offlineMessage = "Reconnect to the internet, then reload Smarty.";
      if (reason === "saved-session") {
        description.textContent = "Unlock your device and reload Smarty. Your saved sign-in has not been removed.";
      } else if (navigator.onLine === false) {
        description.textContent = offlineMessage;
      } else if (isBlockedInAppBrowser) {
        description.textContent = "Try opening Smarty in your browser instead of this app’s built-in browser.";
      }
      content.querySelector("button").onclick = function () {
        if (navigator.onLine === false) {
          description.textContent = offlineMessage;
          return;
        }
        window.location.reload();
      };
      recoveryShown = true;
      root.textContent = "";
      root.appendChild(content);
    };

    setTimeout(function () { window.__SMARTY_SHOW_BOOT_ERROR__(); }, isSmartyNativeApp ? 15000 : 6500);
  })();
</script>

<script
  id="smarty-main-module"
  type="module"
  crossorigin
  src="/src/bootstrap.js"
  onerror="window.__SMARTY_SHOW_BOOT_ERROR__();"
></script>
  </body>
</html>
